<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>續命水補給店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf3e6;
    --surface: #ffffff;
    --surface-2: #f4e8d6;
    --text: #2b1c12;
    --muted: #7a6552;
    --border: #e6d3b8;
    --accent: #d98a2e;
    --accent-ink: #2b1c12;
    --accent-2: #a3342f;
    --shadow: 0 20px 45px -25px rgba(43, 28, 18, 0.45);
    --seg-1: #e8a33d; --seg-1-ink: #2b1c12;
    --seg-2: #b23b3a; --seg-2-ink: #fbf3ee;
    --seg-3: #7c8a52; --seg-3-ink: #23281a;
    --seg-4: #2f6f6d; --seg-4-ink: #eef6f4;
    --seg-5: #c17a3d; --seg-5-ink: #2b1c12;
    --seg-6: #6a4f3a; --seg-6-ink: #f3ecf5;
    --seg-7: #a3773d; --seg-7-ink: #2b1c12;
    --seg-8: #4f6b8a; --seg-8-ink: #eef6f4;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201510;
      --surface: #2b1d16;
      --surface-2: #33241b;
      --text: #f5ebe0;
      --muted: #c4ac93;
      --border: #46321f;
      --accent: #e8a33d;
      --accent-ink: #201510;
      --accent-2: #e0685f;
      --shadow: 0 20px 45px -20px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #201510;
    --surface: #2b1d16;
    --surface-2: #33241b;
    --text: #f5ebe0;
    --muted: #c4ac93;
    --border: #46321f;
    --accent: #e8a33d;
    --accent-ink: #201510;
    --accent-2: #e0685f;
    --shadow: 0 20px 45px -20px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1.25rem, 4vw, 2.5rem) 4rem;
  }

  header {
    max-width: 62ch;
    margin-bottom: clamp(2rem, 5vw, 3rem);
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-2);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    margin-bottom: 0.9rem;
  }

  .eyebrow::before {
    content: "";
    width: 1.4em;
    height: 2px;
    background: var(--accent-2);
    display: inline-block;
  }

  h1 {
    font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
    font-weight: 800;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    line-height: 1.05;
    margin: 0 0 0.7rem;
    text-wrap: balance;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.65;
  }

  main {
    display: grid;
    grid-template-columns: minmax(260px, 320px) 1fr;
    gap: clamp(1.5rem, 4vw, 2.75rem);
    align-items: start;
  }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  button:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .history h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 0.75rem;
  }

  .history ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    max-height: 260px;
    overflow-y: auto;
  }

  .history li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 0.45rem 0.7rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
  }

  .history li .n {
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 0.6rem;
  }

  .history li .t {
    color: var(--muted);
    font-size: 0.72rem;
    flex-shrink: 0;
  }

  .history .empty {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: normal;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
  }

  .wheel-wrap {
    position: relative;
    width: min(88vw, 440px);
    aspect-ratio: 1 / 1;
  }

  .glow {
    position: absolute;
    inset: -12%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 68%);
    z-index: 0;
    pointer-events: none;
  }

  .pointer {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 22px solid var(--accent-2);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.25));
    z-index: 3;
  }

  svg#wheelSvg {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.28));
  }

  #wheelGroup {
    transform-origin: 200px 200px;
    transition: transform 4.6s cubic-bezier(0.14, 0.7, 0.1, 1);
  }

  .hub-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 26%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 3px solid var(--bg);
    background: var(--accent-2);
    color: #fff8f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    line-height: 1;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 10px 18px -8px rgba(0,0,0,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }

  .hub-btn:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.04); }
  .hub-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.97); }
  .hub-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  .result {
    position: relative;
    text-align: center;
    min-height: 4.6rem;
    isolation: isolate;
  }

  .result .label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .result .value {
    position: relative;
    z-index: 2;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 3rem);
    color: var(--accent-2);
  }

  .result .value.placeholder {
    color: var(--muted);
    font-size: 1.15rem;
    font-weight: 600;
  }

  .result .value.pop {
    animation:
      pop 0.7s cubic-bezier(0.2, 0.85, 0.25, 1.45),
      glow-pulse 1.6s ease-in-out 0.05s 2;
  }

  @keyframes pop {
    0% { transform: scale(0.4) rotate(-10deg); opacity: 0; }
    40% { transform: scale(1.25) rotate(5deg); opacity: 1; }
    62% { transform: scale(0.92) rotate(-3deg); }
    80% { transform: scale(1.07) rotate(1.5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  @keyframes glow-pulse {
    0%, 100% { text-shadow: 0 0 8px color-mix(in srgb, var(--accent-2) 35%, transparent); }
    50% { text-shadow: 0 0 26px color-mix(in srgb, var(--accent-2) 75%, transparent), 0 0 46px color-mix(in srgb, var(--accent) 45%, transparent); }
  }

  .confetti-layer {
    position: absolute;
    inset: -40px -50% auto;
    height: 1px;
    pointer-events: none;
    z-index: 1;
    overflow: visible;
  }

  .confetti-piece {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--size, 8px);
    height: var(--size, 8px);
    background: var(--color, var(--accent));
    border-radius: var(--radius, 2px);
    opacity: 0;
    animation: confetti-burst var(--dur, 1.9s) cubic-bezier(0.12, 0.65, 0.2, 1) forwards;
    animation-delay: var(--delay, 0s);
  }

  @keyframes confetti-burst {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.4); opacity: 1; }
    6% { transform: translate(calc(-50% + var(--dx-mid)), calc(-50% + var(--dy-mid))) rotate(calc(var(--rot) * 0.3)) scale(1.15); opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(0.8); opacity: 0; }
  }

  .shockwave {
    position: absolute;
    top: 0;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 4px solid var(--accent-2);
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }

  .shockwave.go {
    animation: shockwave-expand 1.1s cubic-bezier(0.1, 0.6, 0.2, 1) forwards;
  }

  @keyframes shockwave-expand {
    0% { width: 10px; height: 10px; opacity: 0.9; border-width: 5px; }
    100% { width: 460px; height: 460px; opacity: 0; border-width: 1px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #wheelGroup { transition: transform 0.35s ease; }
  }

  footer {
    margin-top: 3rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }

  footer .credit {
    margin-top: 0.4rem;
    font-size: 0.7rem;
    opacity: 0.65;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">飲料轉盤</div>
    <h1>續命水補給店</h1>
    <p>轉盤格子依照資料夾內「飲料店.txt」的店家名單自動產生，按下轉盤中間的珍珠奶茶按鈕開始旋轉，轉盤會逐漸減速停下，指針停在哪一格，今天就喝那一家。</p>
  </header>

  <main>
    <section class="panel" aria-label="抽選紀錄">
      <div class="history">
        <h2>抽選紀錄</h2>
        <ol id="historyList"></ol>
      </div>
    </section>

    <section class="stage" aria-label="轉盤">
      <div class="wheel-wrap">
        <div class="glow" aria-hidden="true"></div>
        <div class="pointer" aria-hidden="true"></div>
        <svg id="wheelSvg" viewBox="0 0 400 400" role="img" aria-label="續命水補給店轉盤">
          <g id="wheelGroup"></g>
        </svg>
        <button class="hub-btn" id="spinBtn" aria-label="開始轉動轉盤">🧋</button>
      </div>

      <div class="result">
        <div class="label">今天喝</div>
        <div class="value placeholder" id="resultValue">轉一下看看喝什麼</div>
        <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <footer>
    指針固定在正上方，轉盤停止時指到的店家即為今天的飲料。
    <div class="credit">by 巴菲榆</div>
  </footer>
</div>

<script>
(function () {
  var CENTER = 200, RADIUS = 188;
  var DEFAULT_DRINKS = ['查有此人', '日丈五', 'mr. whish', '迷客夏', '雙十八木', '先喝道', '上宇林', '萬波'];
  var SEGMENT_COLORS = [
    { fill: 'var(--seg-1)', ink: 'var(--seg-1-ink)' },
    { fill: 'var(--seg-2)', ink: 'var(--seg-2-ink)' },
    { fill: 'var(--seg-3)', ink: 'var(--seg-3-ink)' },
    { fill: 'var(--seg-4)', ink: 'var(--seg-4-ink)' },
    { fill: 'var(--seg-5)', ink: 'var(--seg-5-ink)' },
    { fill: 'var(--seg-6)', ink: 'var(--seg-6-ink)' },
    { fill: 'var(--seg-7)', ink: 'var(--seg-7-ink)' },
    { fill: 'var(--seg-8)', ink: 'var(--seg-8-ink)' }
  ];
  var SVG_NS = 'http://www.w3.org/2000/svg';

  var wheelGroup = document.getElementById('wheelGroup');
  var spinBtn = document.getElementById('spinBtn');
  var resultValue = document.getElementById('resultValue');
  var historyList = document.getElementById('historyList');
  var confettiLayer = document.getElementById('confettiLayer');
  var CONFETTI_COLORS = ['var(--seg-1)', 'var(--seg-2)', 'var(--seg-3)', 'var(--seg-4)', 'var(--accent-2)', 'var(--accent)'];

  var names = [];
  var segAngle = 0;
  var segmentCount = 0;
  var currentRotation = 0;
  var spinning = false;
  var history = [];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function polarToXY(angleDeg, r) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: CENTER + r * Math.cos(rad), y: CENTER + r * Math.sin(rad) };
  }

  function buildWheel(list) {
    names = list;
    segmentCount = names.length;
    segAngle = 360 / segmentCount;
    wheelGroup.innerHTML = '';

    var fontSize = Math.max(11, Math.min(20, segAngle * 0.5));
    var labelR = RADIUS * 0.72;

    for (var i = 0; i < segmentCount; i++) {
      var start = i * segAngle;
      var end = start + segAngle;
      var large = segAngle > 180 ? 1 : 0;
      var p1 = polarToXY(start, RADIUS);
      var p2 = polarToXY(end, RADIUS);
      var color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];

      var path = document.createElementNS(SVG_NS, 'path');
      var d = [
        'M', CENTER, CENTER,
        'L', p1.x.toFixed(2), p1.y.toFixed(2),
        'A', RADIUS, RADIUS, 0, large, 1, p2.x.toFixed(2), p2.y.toFixed(2),
        'Z'
      ].join(' ');
      path.setAttribute('d', d);
      path.setAttribute('fill', color.fill);
      path.setAttribute('stroke', 'var(--surface)');
      path.setAttribute('stroke-width', '2');
      wheelGroup.appendChild(path);

      var mid = start + segAngle / 2;
      var lp = polarToXY(mid, labelR);
      var text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', lp.x.toFixed(2));
      text.setAttribute('y', lp.y.toFixed(2));
      text.setAttribute('fill', color.ink);
      text.setAttribute('font-family', "'Bricolage Grotesque', sans-serif");
      text.setAttribute('font-weight', '700');
      text.setAttribute('font-size', fontSize.toFixed(1));
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('transform', 'rotate(' + mid.toFixed(2) + ' ' + lp.x.toFixed(2) + ' ' + lp.y.toFixed(2) + ')');
      text.textContent = names[i];
      wheelGroup.appendChild(text);
    }

    var rim = document.createElementNS(SVG_NS, 'circle');
    rim.setAttribute('cx', CENTER);
    rim.setAttribute('cy', CENTER);
    rim.setAttribute('r', RADIUS);
    rim.setAttribute('fill', 'none');
    rim.setAttribute('stroke', 'var(--surface)');
    rim.setAttribute('stroke-width', '6');
    wheelGroup.appendChild(rim);

    currentRotation = 0;
    wheelGroup.style.transition = 'none';
    wheelGroup.style.transform = 'rotate(0deg)';
    void wheelGroup.offsetHeight;
    wheelGroup.style.transition = '';

    resetResult();
  }

  function resetResult() {
    resultValue.textContent = '轉一下看看喝什麼';
    resultValue.className = 'value placeholder';
    confettiLayer.innerHTML = '';
  }

  function triggerCelebration() {
    confettiLayer.innerHTML = '';
    if (reduceMotion) return;

    var shock = document.createElement('span');
    shock.className = 'shockwave';
    confettiLayer.appendChild(shock);
    void shock.offsetWidth;
    shock.classList.add('go');

    var count = 56;
    for (var i = 0; i < count; i++) {
      var piece = document.createElement('span');
      piece.className = 'confetti-piece';
      var angle = Math.random() * Math.PI * 2;
      var midDist = 60 + Math.random() * 60;
      var dist = 220 + Math.random() * 260;
      var dxMid = Math.cos(angle) * midDist;
      var dyMid = Math.sin(angle) * midDist * 0.6 - 40;
      var dx = Math.cos(angle) * dist * 0.5;
      var dy = Math.sin(angle) * dist * 0.4 + 340 + Math.random() * 420;
      var size = 7 + Math.random() * 10;
      var isCircle = Math.random() > 0.5;
      var duration = 8.5 + Math.random() * 1.5;
      piece.style.setProperty('--dx-mid', dxMid.toFixed(1) + 'px');
      piece.style.setProperty('--dy-mid', dyMid.toFixed(1) + 'px');
      piece.style.setProperty('--dx', dx.toFixed(1) + 'px');
      piece.style.setProperty('--dy', dy.toFixed(1) + 'px');
      piece.style.setProperty('--rot', (Math.random() * 1080 - 540).toFixed(0) + 'deg');
      piece.style.setProperty('--size', size.toFixed(1) + 'px');
      piece.style.setProperty('--radius', isCircle ? '50%' : '2px');
      piece.style.setProperty('--color', CONFETTI_COLORS[i % CONFETTI_COLORS.length]);
      piece.style.setProperty('--dur', duration.toFixed(2) + 's');
      piece.style.setProperty('--delay', (Math.random() * 0.4).toFixed(2) + 's');
      confettiLayer.appendChild(piece);
    }

    window.setTimeout(function () { confettiLayer.innerHTML = ''; }, 10500);
  }

  function renderHistory() {
    historyList.innerHTML = '';
    if (history.length === 0) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.style.background = 'transparent';
      li.style.padding = '0';
      li.textContent = '尚未有紀錄';
      historyList.appendChild(li);
      return;
    }
    history.forEach(function (item) {
      var li = document.createElement('li');
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = item.name;
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = item.t;
      li.appendChild(n);
      li.appendChild(t);
      historyList.appendChild(li);
    });
  }

  function spin() {
    if (spinning || segmentCount < 2) return;
    spinning = true;
    spinBtn.disabled = true;

    var targetIndex = Math.floor(Math.random() * segmentCount);
    var jitter = (Math.random() * 2 - 1) * (segAngle * 0.5 * 0.7);
    var targetAngle = (targetIndex + 0.5) * segAngle + jitter;

    var spins = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 3);
    var need = ((-targetAngle - currentRotation) % 360 + 360) % 360;
    var newRotation = currentRotation + spins * 360 + need;

    currentRotation = newRotation;
    wheelGroup.style.transform = 'rotate(' + newRotation + 'deg)';

    var duration = reduceMotion ? 400 : 4600 + Math.random() * 500;
    window.setTimeout(function () {
      spinning = false;
      spinBtn.disabled = false;

      resultValue.textContent = names[targetIndex];
      resultValue.className = 'value';
      void resultValue.offsetWidth;
      resultValue.classList.add('pop');
      triggerCelebration();

      var now = new Date();
      var t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      history.unshift({ name: names[targetIndex], t: t });
      if (history.length > 8) history.pop();
      renderHistory();
    }, duration);
  }

  spinBtn.addEventListener('click', spin);

  buildWheel(DEFAULT_DRINKS);
  renderHistory();
})();
</script>
</body>
</html>
